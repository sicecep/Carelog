# .air.toml — air configuration for Go hot reload
#
# See https://github.com/air-verse/air for full documentation.

root = "."
tmp_dir = "tmp"

[build]
  # Binary output
  bin = "./tmp/server"
  # Custom build command
  cmd = "go build -o ./tmp/server ./cmd/server"
  # Files to watch for rebuild
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  # Directories to exclude
  exclude_dir = ["assets", "tmp", "vendor", "web", "node_modules", ".git"]
  # Regex to exclude files
  exclude_regex = ["_test\\.go"]
  # Watch file system events
  follow_symlink = true
  # Poll interval for file system (ms)
  # 0 = watch events (inotify on Linux, FSEvents on macOS)
  poll = 0
  # Log build output
  log = "build-errors.log"

[color]
  app = ""
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = true

[misc]
  # Clean tmp directory on start
  clean_on_exit = true